<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Google (Clone acadêmico)</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card" aria-labelledby="login-title">

            <div class="google-logo" aria-label="Google">
                <span>G</span>
                <span>o</span>
                <span>o</span>
                <span>g</span>
                <span>l</span>
                <span>e</span>
            </div>

            <h1 id="login-title">Fazer login</h1>

            <p class="subtitle">
                Use sua Conta do Google
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        E-mail ou telefone
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                    >

                </div>

                <a href="#" class="link">
                    Esqueceu seu e-mail?
                </a>

                <p class="guest-text">
                    Não está no seu computador?
                    Use o modo visitante para fazer login com privacidade.

                    <a href="#" class="link">
                        Saiba mais
                    </a>
                </p>

                <div class="actions">

                    <a href="#" class="link">
                        Criar conta
                    </a>

                    <button type="submit">
                        Avançar
                    </button>

                </div>

            </form>

        </section>

        <footer class="page-footer">

            <p>
                Clone acadêmico desenvolvido para a disciplina de Front-End.
            </p>

            <nav aria-label="Links do rodapé">

                <a href="#">Ajuda</a>

                <a href="#">Privacidade</a>

                <a href="#">Termos</a>

            </nav>

        </footer>

    </main>

</body>
</html>
